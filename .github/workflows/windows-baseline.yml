name: Windows baseline build

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore packages.config dependencies
        run: nuget restore J2534Diag.sln -NonInteractive
      - name: Build with preserved diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          & msbuild.exe J2534Diag.sln '/p:Configuration=Release' '/p:Platform=Any CPU' '/verbosity:diagnostic' '/flp:logfile=diagnostics/msbuild.log;verbosity=diagnostic' '/bl:diagnostics/msbuild.binlog'
          if ($LASTEXITCODE -ne 0) {
            Write-Host '=== Compilation errors and final log entries ==='
            Select-String -Path diagnostics/msbuild.log -Pattern 'error (CS|MSB|NU)[0-9]+|error :|Build FAILED|warning MSB3270' | Select-Object -Last 60 | ForEach-Object { $_.Line }
            exit $LASTEXITCODE
          }
      - name: Build offline CSV regression tests
        shell: pwsh
        run: |
          & msbuild.exe Tests/CanCaptureCsvTests.csproj '/p:Configuration=Release' '/verbosity:minimal'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute offline CSV regression tests
        shell: pwsh
        run: |
          & ./Tests/bin/Release/CanCaptureCsvTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Initialize MSVC x64 for isolated synthetic DLL
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile synthetic native J2534 DLL (no TOPDON driver)
        shell: cmd
        run: cl /nologo /LD /W4 /EHsc /Fe:mock-j2534.dll Tests\native-j2534-mock\mock.cpp
      - name: Run isolated real-StdCall J2534 simulator
        shell: pwsh
        run: |
          $nativeDll = (Resolve-Path './mock-j2534.dll').Path
          & ./Tests/bin/Release/CanCaptureCsvTests.exe --ci-native-sim $nativeDll
          if ($LASTEXITCODE -ne 0) { throw "Synthetic native J2534 interop failed" }
      - name: Generate engineering preview manifest
        shell: pwsh
        run: |
          $out = 'bin/Release'
          if (-not (Test-Path (Join-Path $out 'J2534Diag.exe'))) { throw 'Main executable absent from Release build' }
          $hashes = Get-ChildItem -LiteralPath $out -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path $out).Path.Length + 1).Replace('\\','/')
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            "$digest  $relative"
          }
          $manifest = @(
            'J2534Diag ENGINEERING PREVIEW - NOT VALIDATED ON RLINK HARDWARE',
            "SourceCommit=$env:GITHUB_SHA",
            "WorkflowRun=$env:GITHUB_RUN_ID",
            'Framework=.NET Framework 4.8.1',
            'BuildPlatform=Any CPU',
            'Requires=Windows 10/11; compatible J2534 driver installed separately',
            'Safety=Offline evaluation first; never assume listen-only electrical isolation',
            'VehicleCapture=UNVERIFIED in this integrated GUI',
            'ApplicationFilesSHA256:'
          ) + $hashes
          Set-Content -Path (Join-Path $out 'ENGINEERING_PREVIEW_MANIFEST.txt') -Value $manifest -Encoding UTF8
          if ($hashes.Count -eq 0) { throw 'No files hashed' }
      - name: Verify timing telemetry and preview manifest
        shell: pwsh
        run: |
          $captureSource = Get-Content 'Services/CanCaptureIntegrityReport.cs' -Raw
          foreach ($field in @('HostTimingFrequencyTicksPerSecond','HostReadElapsedTicksTotal','HostReadElapsedTicksMax','HostProcessingElapsedTicksTotal','HostProcessingElapsedTicksMax')) {
            if (-not $captureSource.Contains($field)) { throw "Timing field missing: $field" }
          }
          $manifest = Get-Content 'bin/Release/ENGINEERING_PREVIEW_MANIFEST.txt' -Raw
          if (-not $manifest.Contains("SourceCommit=$env:GITHUB_SHA")) { throw 'Manifest commit mismatch' }
          if (-not $manifest.Contains('J2534Diag.exe')) { throw 'Manifest executable absent' }
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J2534Diag-build-diagnostics
          path: diagnostics/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: J2534Diag-baseline-windows
          path: bin/Release/**
          if-no-files-found: error
